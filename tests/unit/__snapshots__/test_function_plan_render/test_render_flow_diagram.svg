    .flow-box-cycle { fill: #3a2e12; stroke: #e6a23c; }
    .flow-label { fill: #e8e8e8; }
    .flow-legend-label { fill: #cccccc; }
    .flow-edge { stroke: #aaaaaa; }
    .flow-arrow { fill: #aaaaaa; }
    .flow-junction { fill: #aaaaaa; }
  }
</style>
