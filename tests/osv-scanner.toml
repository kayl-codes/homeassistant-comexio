# OSV-Scanner config for tests/ only (osv-scanner.toml applies to its own directory, not to the
# repo root). tests/requirements.txt pins the unit-test toolchain (homeassistant, pytest, syrupy);
# none of it ships with the integration — the runtime dependencies live in the root
# requirements.txt (generated from manifest.json), which stays fully scanned.
#
# Only the specific advisories below are ignored, each with its reason — any NEW advisory in the
# test toolchain (pytest, syrupy, homeassistant itself, ...) still fails the scan. Every entry
# expires so it gets re-checked; on expiry (or an HA bump) re-run the scan and drop what's fixed.

