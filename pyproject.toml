[project]
name = "homeassistant-comexio"
version = "0.7.2"
description = "Comexio Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.comexio"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"