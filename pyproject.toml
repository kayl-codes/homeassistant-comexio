[project]
name = "homeassistant-comexio"
version = "0.7.5"
description = "Comexio Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # refurb — modern idioms (Sourcery-style refactorings)
    "I",    # isort
    "PERF", # perflint — comprehensions instead of append/assign loops
    "PIE",  # flake8-pie — unnecessary pass/spread/placeholders
    "PLE",  # pylint errors
    "PLW",  # pylint warnings (redefined loop names, unnecessary lambdas, …)
    "PT012",  # pytest.raises() block holds a single statement that may raise (Sonar S5778)
    "PT018",  # composite assertion — split it (Sonar S9073)
    "RET",  # flake8-return — unnecessary assign/else before return (Sourcery-style)
    "RSE",  # flake8-raise — unnecessary parentheses on raised exceptions
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.comexio"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# The CI job runs 3.14 with the full homeassistant runtime package (it ships py.typed), whose sources use
# PEP 696 generic defaults (ConfigEntry[_DataT = None]) that mypy only parses under python_version >= 3.13.
# Pinned to the CI interpreter so a local run on an older Python checks the same way.
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# yaml ships no stubs; scoped per-module so a typo'd/broken import elsewhere
# still surfaces as an error instead of being silently swallowed.
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# tests/ha needs its own environment (tests/ha/requirements.txt) and runs explicitly.
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["custom_components/comexio"]
branch = true

[tool.coverage.report]
skip_empty = true
