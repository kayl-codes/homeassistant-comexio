name: CI

on:
  # Branch pushes are covered by the pull_request run; on master the paths filter skips docs-only merges.
  push:
    branches: [master]
    paths:
      - 'custom_components/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'scripts/generate_requirements.py'
      - 'tests/**'
      - 'tests/requirements.txt'
      - '.gitattributes'
  # No paths filter on pull requests: the master ruleset requires jobs of this workflow, and a required
  # check that never starts blocks the merge (e.g. a docs-only PR). Keep "Type check - mypy" out of the
  # required checks while it is non-blocking (continue-on-error): it reports success unless a step
  # before mypy itself (checkout, Python setup, dependency install) fails.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  ruff:
    name: Ruff Linter & Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ruff
        run: 'pip install --only-binary :all: ruff==0.16.6'
      - name: Run Ruff Check
        run: ruff check .
      - name: Run Ruff Format
        run: ruff format --check .

  security:
    name: Security check - Bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: 'pip install --only-binary :all: bandit==1.9.4'
      - name: Security check - Bandit
        run: bandit -r custom_components/comexio

  mypy:
    name: Type check - mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Same interpreter as HA 2026.10's own runtime and the test jobs.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - name: Install mypy and the full HA stack
        # The real homeassistant package ships py.typed, so mypy checks against the exact runtime version
        # pinned in tests/requirements.txt (the integration's library pin sits there too), not against lagging
        # homeassistant-stubs. Same environment as the unit tests, so no --only-binary: on the cp314 ABI
        # binary-only pip's resolver backtracks through HA's dependency tree until "resolution-too-deep".
        run: pip install -r tests/requirements.txt mypy==2.3.1
      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          mypy custom_components/comexio | tee mypy-output.txt
      - name: Summarize mypy results
        if: always()
        run: |
          # Report mypy's own closing line: only a run that finished has one, so a failed earlier step,
          # a crash or a config error can never read as "0 errors".
          if [ ! -f mypy-output.txt ]; then
            echo "### mypy: did not run (an earlier step failed) — see job log" >> "$GITHUB_STEP_SUMMARY"
          elif grep -qE '^(Found [0-9]+ errors? in|Success: no issues found in) ' mypy-output.txt; then
            summary="$(tail -n 1 mypy-output.txt)"
            echo "### mypy: ${summary} (non-blocking during initial type-coverage rollout)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### mypy: run did not complete (crash or config error) — see job log" >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    name: Unit tests - pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the diff coverage report compares against the PR's base branch.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Same interpreter as HA 2026.10's own runtime; homeassistant is pinned in tests/requirements.txt.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        # No --only-binary here (unlike the other jobs): this needs the full homeassistant runtime,
        # and with binary-only pip's resolver backtracks through HA's cp314 tree until
        # "resolution-too-deep" (verified on PR #90). Test-only toolchain, exact top-level pins.
        run: pip install -r tests/requirements.txt
      - name: Run unit tests
        run: pytest tests/unit -q --cov --cov-report=xml
      - name: Diff coverage report
        # Non-blocking: most HA-bound code (coordinator, repairs, platforms) has no unit tests yet, so a
        # threshold would fail nearly every PR. The report lists the changed lines no test reaches.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --format markdown:diff-cover.md; then
            echo "### Diff coverage report failed - see the step log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

  ha-tests:
    name: HA integration tests - pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/ha/requirements.txt
      - name: Install test dependencies
        # Own requirements file: pytest-homeassistant-custom-component pins pytest/syrupy versions
        # that clash with tests/requirements.txt. No --only-binary, same reason as the unit tests.
        run: pip install -r tests/ha/requirements.txt
      - name: Run HA integration tests
        # asyncio_mode is passed here, not in pyproject.toml: the unit-test environment has no
        # pytest-asyncio, and --strict-config would reject the unknown option there.
        run: pytest tests/ha -q -o asyncio_mode=auto

  check-requirements-sync:
    name: Verify requirements.txt matches manifest.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Check requirements.txt is in sync with manifest.json
        run: python scripts/generate_requirements.py --check

  validate:
    name: Check hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
