repos:
  # Automatisches Beheben von Whitespaces und Dateiendungen
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # Ruff Linter und Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # requirements.txt aus manifest.json ableiten (Quelle der Wahrheit bleibt manifest.json)
  - repo: local
    hooks:
      - id: generate-requirements
        name: Generate requirements.txt from manifest.json
        entry: python scripts/generate_requirements.py
        language: system
        files: ^(custom_components/comexio/manifest\.json|requirements\.txt)$
        pass_filenames: false
